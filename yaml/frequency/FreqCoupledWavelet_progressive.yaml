# Ultralytics YOLO 🚀, AGPL-3.0 license
# Two-stream RGB-Infrared YOLOv8 OBB
# Frequency-Coupled V1 - PROGRESSIVE
#
# Progressive rule:
#   P3 RGB/IR -> fused P3 -> feed back to both modality branches
#   P4 RGB/IR -> fused P4 -> feed back to both modality branches
#   P5 RGB/IR -> fused P5
#
# Feedback:
#   Cat(modality_feature, fused_feature) -> independent 1x1 Conv
#
# FreqCoupledWaveletFusion YAML args:
#   [d_state, expand, d_conv, hf_kernel, transition_mode]
# parse_model() prepends the actual input channel c automatically.

ch: 6
nc: 5

scales:
  s: [0.33, 0.50, 1024]

backbone:
  - [-1, 1, IN, []]              # 0
  - [-1, 1, Multiin, [1]]        # 1 RGB
  - [-2, 1, Multiin, [2]]        # 2 IR

  - [1, 1, Conv, [32, 3, 2]]     # 3
  - [-1, 1, Conv, [64, 3, 2]]    # 4
  - [-1, 3, C2f, [64, True]]     # 5

  - [2, 1, Conv, [32, 3, 2]]     # 6
  - [-1, 1, Conv, [64, 3, 2]]    # 7
  - [-1, 3, C2f, [64, True]]     # 8

  # ------------------------- P3 -------------------------
  - [5, 1, Conv, [128, 3, 2]]    # 9  RGB
  - [8, 1, Conv, [128, 3, 2]]    # 10 IR
  - [-2, 6, C2f, [128, True]]    # 11 RGB
  - [-2, 6, C2f, [128, True]]    # 12 IR
  - [[11, 12], 1, FreqCoupledWaveletFusion, [16, 2.0, 3, 3, "algorithm1"]]  # 13 fused P3

  - [[11, 13], 1, Concat, [1]]   # 14
  - [-1, 1, Conv, [128, 1, 1]]   # 15 refined RGB P3
  - [[12, 13], 1, Concat, [1]]   # 16
  - [-1, 1, Conv, [128, 1, 1]]   # 17 refined IR P3

  # ------------------------- P4 -------------------------
  - [15, 1, Conv, [256, 3, 2]]   # 18 RGB
  - [17, 1, Conv, [256, 3, 2]]   # 19 IR
  - [-2, 6, C2f, [256, True]]    # 20 RGB
  - [-2, 6, C2f, [256, True]]    # 21 IR
  - [[20, 21], 1, FreqCoupledWaveletFusion, [16, 2.0, 3, 3, "algorithm1"]]  # 22 fused P4

  - [[20, 22], 1, Concat, [1]]   # 23
  - [-1, 1, Conv, [256, 1, 1]]   # 24 refined RGB P4
  - [[21, 22], 1, Concat, [1]]   # 25
  - [-1, 1, Conv, [256, 1, 1]]   # 26 refined IR P4

  # ------------------------- P5 -------------------------
  - [24, 1, Conv, [512, 3, 2]]   # 27 RGB
  - [26, 1, Conv, [512, 3, 2]]   # 28 IR
  - [-2, 3, C2f, [512, True]]    # 29 RGB
  - [-2, 3, C2f, [512, True]]    # 30 IR
  - [-2, 1, SPPF, [512, 5]]      # 31 RGB
  - [-2, 1, SPPF, [512, 5]]      # 32 IR
  - [[31, 32], 1, FreqCoupledWaveletFusion, [16, 2.0, 3, 3, "algorithm1"]]  # 33 fused P5

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]      # 34
  - [[-1, 22], 1, Concat, [1]]                     # 35
  - [-1, 3, C2f, [512]]                            # 36

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]      # 37
  - [[-1, 13], 1, Concat, [1]]                     # 38
  - [-1, 3, C2f, [256]]                            # 39 P3/8

  - [-1, 1, Conv, [256, 3, 2]]                     # 40
  - [[-1, 36], 1, Concat, [1]]                     # 41
  - [-1, 3, C2f, [512]]                            # 42 P4/16

  - [-1, 1, Conv, [512, 3, 2]]                     # 43
  - [[-1, 33], 1, Concat, [1]]                     # 44
  - [-1, 3, C2f, [1024]]                           # 45 P5/32

  - [[39, 42, 45], 1, OBB, [nc, 1]]                # 46
