# Ultralytics YOLO 🚀, AGPL-3.0 license
# Two-stream RGB-Infrared YOLOv8 OBB
# Frequency-Coupled V1 - PARALLEL
#
# P3/P4/P5 are extracted independently by the RGB/IR backbones.
# Fusion at one level does NOT feed back into deeper backbone levels.
#
# FreqCoupledWaveletFusion YAML args:
#   [d_state, expand, d_conv, hf_kernel, transition_mode]
# parse_model() prepends the actual input channel c automatically.

ch: 6
nc: 5

scales:
  s: [0.33, 0.50, 1024]

backbone:
  - [-1, 1, IN, []]              # 0
  - [-1, 1, Multiin, [1]]        # 1 RGB
  - [-2, 1, Multiin, [2]]        # 2 IR

  - [1, 1, Conv, [32, 3, 2]]     # 3  P1/2 RGB
  - [-1, 1, Conv, [64, 3, 2]]    # 4  P2/4 RGB
  - [-1, 3, C2f, [64, True]]     # 5  P2/4 RGB

  - [2, 1, Conv, [32, 3, 2]]     # 6  P1/2 IR
  - [-1, 1, Conv, [64, 3, 2]]    # 7  P2/4 IR
  - [-1, 3, C2f, [64, True]]     # 8  P2/4 IR

  - [5, 1, Conv, [128, 3, 2]]    # 9  P3/8 RGB
  - [8, 1, Conv, [128, 3, 2]]    # 10 P3/8 IR
  - [-2, 6, C2f, [128, True]]    # 11 P3/8 RGB
  - [-2, 6, C2f, [128, True]]    # 12 P3/8 IR

  - [-2, 1, Conv, [256, 3, 2]]   # 13 P4/16 RGB
  - [-2, 1, Conv, [256, 3, 2]]   # 14 P4/16 IR
  - [-2, 6, C2f, [256, True]]    # 15 P4/16 RGB
  - [-2, 6, C2f, [256, True]]    # 16 P4/16 IR

  - [-2, 1, Conv, [512, 3, 2]]   # 17 P5/32 RGB
  - [-2, 1, Conv, [512, 3, 2]]   # 18 P5/32 IR
  - [-2, 3, C2f, [512, True]]    # 19 P5/32 RGB
  - [-2, 3, C2f, [512, True]]    # 20 P5/32 IR
  - [-2, 1, SPPF, [512, 5]]      # 21 P5/32 RGB
  - [-2, 1, SPPF, [512, 5]]      # 22 P5/32 IR

  - [[11, 12], 1, FreqCoupledWaveletFusion, [16, 2.0, 3, 3, "algorithm1"]]  # 23 fused P3
  - [[15, 16], 1, FreqCoupledWaveletFusion, [16, 2.0, 3, 3, "algorithm1"]]  # 24 fused P4
  - [[21, 22], 1, FreqCoupledWaveletFusion, [16, 2.0, 3, 3, "algorithm1"]]  # 25 fused P5

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]      # 26
  - [[-1, 24], 1, Concat, [1]]                     # 27
  - [-1, 3, C2f, [512]]                            # 28

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]      # 29
  - [[-1, 23], 1, Concat, [1]]                     # 30
  - [-1, 3, C2f, [256]]                            # 31 P3/8

  - [-1, 1, Conv, [256, 3, 2]]                     # 32
  - [[-1, 28], 1, Concat, [1]]                     # 33
  - [-1, 3, C2f, [512]]                            # 34 P4/16

  - [-1, 1, Conv, [512, 3, 2]]                     # 35
  - [[-1, 25], 1, Concat, [1]]                     # 36
  - [-1, 3, C2f, [1024]]                           # 37 P5/32

  # - [[31, 34, 37], 1, OBB, [nc, 1]]                # 38
  - [[31, 34, 37], 1, Detect, [nc]]               # 38 Detect(P3, P4, P5)
