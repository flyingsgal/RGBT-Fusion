# Two-stream RGB-Infrared YOLOv8 OBB
# Frequency-MoE V2-0: Full-independent Joint Fusion Masters
# LL/LH/HL/HH each own an independent V1 Router and an independent V2 Joint Expert Bank.

ch: 6
nc: 5

scales:
  s: [0.33, 0.50, 1024]

backbone:
  # ------------------------- input split -------------------------
  - [-1, 1, IN, []]          # 0
  - [-1, 1, Multiin, [1]]    # 1 RGB
  - [-2, 1, Multiin, [2]]    # 2 Infrared

  # ------------------------- RGB shallow backbone -------------------------
  - [1, 1, Conv, [32, 3, 2]]     # 3-P1/2 RGB
  - [-1, 1, Conv, [64, 3, 2]]    # 4-P2/4 RGB
  - [-1, 3, C2f, [64, True]]     # 5-P2/4 RGB

  # ------------------------- IR shallow backbone -------------------------
  - [2, 1, Conv, [32, 3, 2]]     # 6-P1/2 IR
  - [-1, 1, Conv, [64, 3, 2]]    # 7-P2/4 IR
  - [-1, 3, C2f, [64, True]]     # 8-P2/4 IR

  # ------------------------- P3 / stride 8 -------------------------
  - [5, 1, Conv, [128, 3, 2]]    # 9-P3/8 RGB
  - [8, 1, Conv, [128, 3, 2]]    # 10-P3/8 IR
  - [-2, 6, C2f, [128, True]]    # 11-P3/8 RGB
  - [-2, 6, C2f, [128, True]]    # 12-P3/8 IR

  # ------------------------- P4 / stride 16 -------------------------
  - [-2, 1, Conv, [256, 3, 2]]   # 13-P4/16 RGB
  - [-2, 1, Conv, [256, 3, 2]]   # 14-P4/16 IR
  - [-2, 6, C2f, [256, True]]    # 15-P4/16 RGB
  - [-2, 6, C2f, [256, True]]    # 16-P4/16 IR

  # ------------------------- P5 / stride 32 -------------------------
  - [-2, 1, Conv, [512, 3, 2]]   # 17-P5/32 RGB
  - [-2, 1, Conv, [512, 3, 2]]   # 18-P5/32 IR
  - [-2, 3, C2f, [512, True]]    # 19-P5/32 RGB
  - [-2, 3, C2f, [512, True]]    # 20-P5/32 IR
  - [-2, 1, SPPF, [512, 5]]      # 21-P5/32 RGB
  - [-2, 1, SPPF, [512, 5]]      # 22-P5/32 IR

  # ------------------------- Frequency-MoE fusion -------------------------
  # YAML args: [num_experts, top_k, expert_ratio]
  # parse_model() automatically prepends the actual channel number c.
  # Default experiment: N=4 experts, Top-2 sparse routing, bottleneck ratio=0.25.

  # 23: fused P3
  - [[11, 12], 1, FreqMoEFullIndependentV2, [4, 2, 0.333333]]

  # 24: fused P4
  - [[15, 16], 1, FreqMoEFullIndependentV2, [4, 2, 0.333333]]

  # 25: fused P5
  - [[21, 22], 1, FreqMoEFullIndependentV2, [4, 2, 0.333333]]

# YOLOv8 OBB head
head:
  # ------------------------- FPN: P5 -> P4 -------------------------
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]      # 26 upsample fused P5
  - [[-1, 24], 1, Concat, [1]]                     # 27 cat fused P4
  - [-1, 3, C2f, [512]]                            # 28 P4 head

  # ------------------------- FPN: P4 -> P3 -------------------------
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]      # 29
  - [[-1, 23], 1, Concat, [1]]                     # 30 cat fused P3
  - [-1, 3, C2f, [256]]                            # 31 P3/8 small

  # ------------------------- PAN: P3 -> P4 -------------------------
  - [-1, 1, Conv, [256, 3, 2]]                     # 32
  - [[-1, 28], 1, Concat, [1]]                     # 33 cat head P4
  - [-1, 3, C2f, [512]]                            # 34 P4/16 medium

  # ------------------------- PAN: P4 -> P5 -------------------------
  - [-1, 1, Conv, [512, 3, 2]]                     # 35
  - [[-1, 25], 1, Concat, [1]]                     # 36 cat fused P5
  - [-1, 3, C2f, [1024]]                           # 37 P5/32 large

  # ------------------------- OBB detection -------------------------
  - [[31, 34, 37], 1, OBB, [nc, 1]]                # 38 OBB(P3, P4, P5)
